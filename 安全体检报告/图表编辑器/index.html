<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word 图表编辑器</title>
  <link rel="stylesheet" href="assets/editor.css?v=20260911-drop-en-hints">
</head>
<body>
  <main class="app-shell">
    <header class="app-header"><div><h1>Word 图表编辑器</h1><p>本地修改报告图表并生成新的 Word 文件</p></div><span id="status" class="status">Top5 修复版：等待选择文件</span></header>
    <section class="file-bar" aria-label="文件选择">
      <label class="file-control">报告 HTML <input id="html-file" type="file" accept=".html,text/html"></label>
      <label class="file-control">原始 Word <input id="docx-file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label>
      <button id="replace-image" type="button" disabled>用自选 PNG 替换选中图片</button>
      <input id="png-file" type="file" accept="image/png" hidden>
      <button id="download" type="button" class="primary" disabled>生成新版 Word</button>
    </section>
    <p class="notice">所有处理均在当前浏览器完成。请先选择 Word；选择对应报告 HTML 后，可直接编辑已支持图表的数据并导出 PNG。</p>
    <section class="workspace">
      <aside class="media-panel"><h2>Word 中的图片</h2><p id="media-hint">载入 DOCX 后显示缩略图。选择要替换的图表图片。</p><div id="media-list" class="media-list"></div></aside>
      <section class="editor-panel"><div class="editor-heading"><div><h2 id="chart-title">图表数据</h2></div><select id="chart-select" disabled></select></div><div id="fields" class="fields"></div></section>
      <aside class="preview-panel"><h2>实时预览</h2><div id="preview" class="preview"><p>选择图表后显示预览</p></div><p id="mapping-hint" class="mapping-hint">选中左侧 Word 图片后，点击“应用到选中图片”。</p><button id="apply-chart" type="button" disabled>应用图表到选中图片</button></aside>
    </section>
  </main>
  <template id="row-template"><div class="data-row"><input class="name" aria-label="分类名称"><input class="value" type="number" min="0" step="any" aria-label="数值"><button type="button" class="remove" title="删除此项">删除</button></div></template>
  <iframe id="render-frame" title="原始报告图表渲染器" aria-hidden="true"></iframe>
  <script src="assets/vendor/html2canvas-1.4.1.min.js"></script>
  <script src="assets/editor.js?v=20260911-drop-en-hints"></script>
</body>
</html>
